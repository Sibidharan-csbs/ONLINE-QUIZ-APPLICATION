# ---------- Server ----------
server.port=8080

# ---------- H2 Database (In-Memory) ----------
spring.datasource.url=jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ---------- JWT ----------
# Must be at least 32 characters (256 bits) for HS256. Replace in production.
jwt.secret=ChangeThisToALongRandomSecretKeyForProductionUse123456
jwt.expiration-ms=86400000

# ---------- Seed data ----------
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
