<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Online Quiz Application</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-card">
  <h2 class="mb-1">Welcome back</h2>
  <p class="text-muted mb-4">Sign in to continue to the Quiz Portal</p>

  <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label">Email address</label>
      <input type="email" class="form-control" id="email" required placeholder="you@example.com">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary w-100" id="loginBtn">Login</button>
  </form>

  <p class="text-center mt-3 mb-0">
    Don't have an account? <a href="register.html">Register here</a>
  </p>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const alertBox = document.getElementById('alertBox');
  alertBox.classList.add('d-none');
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const data = await apiPost('/api/auth/login', {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    }, false);

    saveSession(data);
    window.location.href = data.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
  } catch (err) {
    alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
    alertBox.classList.remove('d-none');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login';
  }
});
</script>
</body>
</html>
