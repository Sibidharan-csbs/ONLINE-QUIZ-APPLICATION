<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Online Quiz Application</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-card">
  <h2 class="mb-1">Create your account</h2>
  <p class="text-muted mb-4">Join the Quiz Portal as a student</p>

  <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

  <form id="registerForm">
    <div class="mb-3">
      <label class="form-label">Full name</label>
      <input type="text" class="form-control" id="fullName" required placeholder="Jane Doe">
    </div>
    <div class="mb-3">
      <label class="form-label">Email address</label>
      <input type="email" class="form-control" id="email" required placeholder="you@example.com">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" minlength="6" required placeholder="At least 6 characters">
    </div>
    <button type="submit" class="btn btn-primary w-100" id="registerBtn">Create account</button>
  </form>

  <p class="text-center mt-3 mb-0">
    Already have an account? <a href="login.html">Login here</a>
  </p>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  const alertBox = document.getElementById('alertBox');
  alertBox.classList.add('d-none');
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const data = await apiPost('/api/auth/register', {
      fullName: document.getElementById('fullName').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    }, false);

    saveSession(data);
    window.location.href = 'dashboard.html';
  } catch (err) {
    alertBox.textContent = err.message || 'Registration failed.';
    alertBox.classList.remove('d-none');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
